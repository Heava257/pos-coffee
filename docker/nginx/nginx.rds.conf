server {
    listen 80;
    server_name growme.duckdns.org;

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name growme.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/growme.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/growme.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Root redirect: Redirect to your hosted frontend (e.g. Vercel)
    # Change 'https://your-vercel-app.vercel.app' to your actual frontend hosting URL
    location / {
        return 302 https://your-vercel-app.vercel.app$request_uri;
    }

    # Proxy API requests to Node.js Backend Server container
    location /api/ {
        proxy_pass http://server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve static assets from Node.js Backend
    location /public/ {
        proxy_pass http://server:8080/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
